<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="phoneClip">
      <rect x="760" y="42" width="244" height="528" rx="38"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#101828" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1877f2" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f5f5f7"/>
  <path d="M0 0h1200v630H0z" fill="#f5f5f7"/>
  <path d="M0 0h1200v630H0z" fill="url(#none)" opacity="0"/>
  <circle cx="980" cy="80" r="320" fill="#1877f2" opacity="0.08"/>
  <circle cx="1030" cy="540" r="260" fill="#28d84d" opacity="0.08"/>
  <circle cx="530" cy="120" r="260" fill="#00d9e6" opacity="0.07"/>

  <g transform="translate(82 78)">
    <image href="app-icon.png" x="0" y="0" width="108" height="108" clip-path="inset(0 round 24px)" filter="url(#smallShadow)"/>
    <text x="132" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0b0f18">inQRedible</text>
    <text x="132" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1877f2">Generador QR para iPhone</text>
  </g>

  <text x="82" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="72" font-weight="900" fill="#0b0f18">QR con logo,</text>
  <text x="82" y="344" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="72" font-weight="900" fill="#0b0f18">escáner y barras.</text>
  <text x="84" y="402" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#3a4150">Crea códigos QR para enlaces, Wi-Fi, contactos,</text>
  <text x="84" y="438" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#3a4150">eventos y redes sociales. Exporta en alta resolución.</text>

  <g transform="translate(82 496)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="20" font-weight="800">
    <rect x="0" y="0" width="126" height="46" rx="23" fill="#1877f2"/>
    <text x="63" y="30" fill="white" text-anchor="middle">19 tipos</text>
    <rect x="144" y="0" width="158" height="46" rx="23" fill="white" stroke="#d8dbe3"/>
    <text x="223" y="30" fill="#0b0f18" text-anchor="middle">11 formas</text>
    <rect x="320" y="0" width="190" height="46" rx="23" fill="white" stroke="#d8dbe3"/>
    <text x="415" y="30" fill="#0b0f18" text-anchor="middle">PNG PRO</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="744" y="26" width="276" height="560" rx="52" fill="#080a0f"/>
    <rect x="760" y="42" width="244" height="528" rx="38" fill="#fff"/>
    <image href="es/screenshot-hero.png" x="760" y="42" width="244" height="528" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClip)"/>
  </g>

  <g transform="translate(920 462)" filter="url(#softShadow)">
    <rect width="198" height="82" rx="24" fill="white" opacity="0.92"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="21" font-weight="900" fill="#0b0f18">App Store</text>
    <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#6b7280">Descarga gratis</text>
  </g>
</svg>
